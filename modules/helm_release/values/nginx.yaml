---
controller:
  ingressClassResource:
    name: nginx
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  watchIngressWithoutClass: true
  extraArgs:
    enable-ssl-passthrough: "true"
    ingress-class: nginx

  config:
    enable-underscores-in-headers: "true"
